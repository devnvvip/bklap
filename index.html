<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>devnvios.io.vn — Trợ Lý AI</title>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    
    html, body {
      height: 100%;
      height: 100dvh;
      background-color: #F8FAFC;
      color: #0F172A;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      overflow: hidden;
      position: fixed;
      width: 100%;
    }

    .chat-allow-select {
      user-select: text !important;
      -webkit-user-select: text !important;
    }

    .app-container {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      width: 100%;
    }

    .header {
      background-color: #FFFFFF;
      border-bottom: 1px solid #E2E8F0;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 20;
      flex-shrink: 0;
    }

    .header-brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .avatar-logo {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background-color: #0F172A;
      color: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 14px;
    }

    .header-title {
      font-size: 14px;
      font-weight: 700;
      color: #0F172A;
      line-height: 1.2;
    }

    .header-subtitle {
      font-size: 11px;
      color: #64748B;
      font-weight: 500;
    }

    .btn-info {
      background-color: #F1F5F9;
      color: #334155;
      font-size: 12px;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 10px;
      border: 1px solid #E2E8F0;
      cursor: pointer;
    }

    .chat-box {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      background-color: #F8FAFC;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .msg-row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      max-width: 92%;
    }

    .msg-row.user {
      margin-left: auto;
      flex-direction: row-reverse;
    }

    .avatar-msg {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background-color: #0F172A;
      color: #FFFFFF;
      font-size: 11px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .avatar-msg.user {
      background-color: #E2E8F0;
      color: #334155;
    }

    .bubble {
      background-color: #FFFFFF;
      border: 1px solid #E2E8F0;
      border-radius: 16px;
      padding: 12px 14px;
      font-size: 14px;
      line-height: 1.6;
      color: #1E293B;
      box-shadow: 0 1px 2px rgba(0,0,0,0.03);
      width: 100%;
      word-break: break-word;
    }

    .msg-row.user .bubble {
      background-color: #0F172A;
      color: #FFFFFF;
      border: none;
    }

    .code-container {
      background-color: #0F172A;
      border-radius: 10px;
      margin: 10px 0;
      overflow: hidden;
      border: 1px solid #334155;
    }

    .code-header {
      background-color: #1E293B;
      padding: 6px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .code-title {
      font-family: monospace;
      font-size: 11px;
      color: #38BDF8;
      text-transform: uppercase;
    }

    .copy-btn {
      background-color: #334155;
      color: #F1F5F9;
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 6px;
      cursor: pointer;
      border: none;
    }

    pre code {
      font-family: Consolas, Monaco, monospace !important;
      font-size: 12px !important;
      color: #E2E8F0;
      display: block;
      padding: 12px;
      overflow-x: auto !important;
      white-space: pre !important;
    }

    .footer {
      background-color: #FFFFFF;
      border-top: 1px solid #E2E8F0;
      padding: 10px 12px;
      flex-shrink: 0;
      z-index: 20;
    }

    .input-form {
      display: flex;
      align-items: center;
      gap: 8px;
      max-width: 900px;
      margin: 0 auto;
    }

    .chat-input {
      flex: 1;
      background-color: #F1F5F9;
      border: 1px solid transparent;
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 15px;
      color: #0F172A;
      outline: none;
    }

    .send-btn {
      background-color: #0F172A;
      color: #FFFFFF;
      border: none;
      border-radius: 12px;
      padding: 10px 16px;
      font-weight: 600;
      cursor: pointer;
    }

    .footer-sub {
      text-align: center;
      font-size: 10px;
      color: #94A3B8;
      margin-top: 6px;
    }

    .typing-dots {
      display: inline-flex;
      gap: 4px;
    }
    .dot {
      width: 5px;
      height: 5px;
      background-color: #94A3B8;
      border-radius: 50%;
      animation: pulse 1.2s infinite ease-in-out;
    }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes pulse {
      0%, 80%, 100% { opacity: 0.3; transform: scale(0.8); }
      40% { opacity: 1; transform: scale(1.2); }
    }
  </style>
</head>
<body>

  <div class="app-container">
    <header class="header">
      <div class="header-brand">
        <div class="avatar-logo">dev</div>
        <div>
          <div class="header-title">devnvios.io.vn</div>
          <div class="header-subtitle">Trợ Lý AI Thông Minh (Gemini 2.0)</div>
        </div>
      </div>

      <button onclick="alert('devnvios.io.vn — Dịch vụ lập trình & AI')" class="btn-info">
        ℹ️ Giới Thiệu
      </button>
    </header>

    <main id="chatBox" class="chat-box">
      <div class="msg-row">
        <div class="avatar-msg">AI</div>
        <div class="bubble chat-allow-select">
          <p style="font-weight:700; margin-bottom: 4px;">Xin chào! 👋</p>
          <p>Mình là <strong>Trợ lý AI devnvios</strong>. Bạn cần hỗ trợ gì hôm nay?</p>
        </div>
      </div>
    </main>

    <footer class="footer">
      <form id="chatForm" onsubmit="handleSend(event)" class="input-form">
        <input 
          type="text" 
          id="userInput" 
          placeholder="Nhập tin nhắn..." 
          autocomplete="off"
          class="chat-input chat-allow-select"
        />
        <button type="submit" id="sendBtn" class="send-btn">
          ➤
        </button>
      </form>
      <div class="footer-sub">
        devnvios.io.vn — Trợ Lý AI Tốc Độ Cao
      </div>
    </footer>
  </div>

  <script>
    // API Key Gemini của bạn đã dán trực tiếp:
    const GEMINI_API_KEY = "AQ.Ab8RN6I3u-Saozo3Y5d4sqFSmMdsh7jOLBMea6NVj5qnvZC9yQ";

    const SYSTEM_PROMPT = "Bạn là Trợ lý AI devnvios thông minh, hỗ trợ lập trình và giải đáp thắc mắc chuyên nghiệp bằng tiếng Việt.";

    const contentsHistory = [];

    const chatBox = document.getElementById('chatBox');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');

    async function handleSend(e) {
      e.preventDefault();
      const text = userInput.value.trim();
      if (!text) return;

      appendUserMessage(text);
      userInput.value = '';
      userInput.blur();

      setLoading(true);
      const loadingId = appendLoadingIndicator();

      contentsHistory.push({
        role: "user",
        parts: [{ text: text }]
      });

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${GEMINI_API_KEY}`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            contents: contentsHistory,
            systemInstruction: {
              parts: [{ text: SYSTEM_PROMPT }]
            }
          })
        });

        removeLoadingIndicator(loadingId);
        setLoading(false);

        if (!response.ok) {
          const errData = await response.json();
          console.error("Gemini Response Error:", errData);
          const errMsg = errData?.error?.message || "Mã API Key bị từ chối!";
          appendAIMessage(`Lỗi phản hồi từ Google: ${errMsg}`);
          contentsHistory.pop();
          return;
        }

        const data = await response.json();
        const replyText = data?.candidates?.[0]?.content?.parts?.[0]?.text;

        if (replyText) {
          contentsHistory.push({
            role: "model",
            parts: [{ text: replyText }]
          });
          appendAIMessage(replyText);
        } else {
          appendAIMessage("Không nhận được phản hồi từ AI!");
        }

      } catch (err) {
        console.error("Fetch Error:", err);
        removeLoadingIndicator(loadingId);
        setLoading(false);
        appendAIMessage("Lỗi kết nối mạng!");
        contentsHistory.pop();
      }
    }

    function appendUserMessage(msg) {
      const div = document.createElement('div');
      div.className = "msg-row user";
      div.innerHTML = `
        <div class="avatar-msg user">Bạn</div>
        <div class="bubble chat-allow-select">
          ${escapeHTML(msg)}
        </div>
      `;
      chatBox.appendChild(div);
      scrollToBottom();
    }

    function appendLoadingIndicator() {
      const id = 'loading-' + Date.now();
      const div = document.createElement('div');
      div.id = id;
      div.className = "msg-row";
      div.innerHTML = `
        <div class="avatar-msg">AI</div>
        <div class="bubble" style="color: #64748B;">
          Đang suy nghĩ... 
          <span class="typing-dots">
            <span class="dot"></span><span class="dot"></span><span class="dot"></span>
          </span>
        </div>
      `;
      chatBox.appendChild(div);
      scrollToBottom();
      return id;
    }

    function removeLoadingIndicator(id) {
      const el = document.getElementById(id);
      if (el) el.remove();
    }

    function appendAIMessage(rawText) {
      const div = document.createElement('div');
      div.className = "msg-row";
      const formattedHTML = formatMarkdown(rawText);

      div.innerHTML = `
        <div class="avatar-msg">AI</div>
        <div class="bubble chat-allow-select">
          ${formattedHTML}
        </div>
      `;
      chatBox.appendChild(div);
      scrollToBottom();
    }

    function formatMarkdown(text) {
      const codeBlocks = [];

      let safeText = text.replace(/```(\w+)?\n([\s\S]*?)```/g, function(match, lang, code) {
        const index = codeBlocks.length;
        codeBlocks.push({ lang: lang || 'code', code: code });
        return `___CODE_BLOCK_${index}___`;
      });

      safeText = escapeHTML(safeText);

      safeText = safeText.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
      safeText = safeText.replace(/\n/g, '<br>');

      codeBlocks.forEach((item, index) => {
        const codeId = 'code-' + Math.random().toString(36).substr(2, 9);
        const codeContainerHtml = `
          <div class="code-container">
            <div class="code-header">
              <span class="code-title">${escapeHTML(item.lang)}</span>
              <button class="copy-btn" onclick="copyCodeBlock('${codeId}', this)">Sao chép</button>
            </div>
            <pre><code id="${codeId}">${escapeHTML(item.code)}</code></pre>
          </div>`;
        safeText = safeText.replace(`___CODE_BLOCK_${index}___`, codeContainerHtml);
      });

      return safeText;
    }

    function copyCodeBlock(elementId, btnElement) {
      const codeElement = document.getElementById(elementId);
      if (!codeElement) return;

      const codeText = codeElement.innerText || codeElement.textContent;

      const textarea = document.createElement('textarea');
      textarea.value = codeText;
      textarea.style.position = 'fixed';
      textarea.style.opacity = '0';
      document.body.appendChild(textarea);
      textarea.focus();
      textarea.select();
      try {
        document.execCommand('copy');
        btnElement.innerText = "Đã chép ✓";
        btnElement.style.backgroundColor = "#059669";
        setTimeout(() => {
          btnElement.innerText = "Sao chép";
          btnElement.style.backgroundColor = "#334155";
        }, 2000);
      } catch (err) {
        alert('Lỗi sao chép');
      }
      document.body.removeChild(textarea);
    }

    function setLoading(isLoading) {
      sendBtn.disabled = isLoading;
      userInput.disabled = isLoading;
      sendBtn.style.opacity = isLoading ? '0.5' : '1';
    }

    function scrollToBottom() {
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function escapeHTML(str) {
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }
  </script>
</body>
</html>
