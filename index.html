<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini AI Pro</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --chat-bg: #161b22;
            --border-color: #30363d;
            --text-color: #c9d1d9;
            --accent-color: #8b5cf6;
            --accent-hover: #7c3aed;
            --user-bubble: #238636;
            --ai-bubble: #21262d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Header */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 20px;
            background-color: var(--chat-bg);
            border-bottom: 1px solid var(--border-color);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .bot-avatar {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, #a855f7, #6366f1);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
        }

        .bot-info h1 {
            font-size: 16px;
            color: #f0f6fc;
        }

        .bot-info p {
            font-size: 12px;
            color: #3fb950;
        }

        .clear-btn {
            background: none;
            border: none;
            color: #8b949e;
            cursor: pointer;
            font-size: 18px;
            padding: 4px;
            border-radius: 4px;
        }

        .clear-btn:hover {
            color: #f0f6fc;
            background-color: rgba(255,255,255,0.1);
        }

        /* Chat Container */
        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            scroll-behavior: smooth;
        }

        .message {
            display: flex;
            gap: 12px;
            max-width: 85%;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            margin-left: auto;
            flex-direction: row-reverse;
        }

        .message .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            flex-shrink: 0;
        }

        .message.user .avatar {
            background-color: #238636;
            color: white;
        }

        .message.ai .avatar {
            background-color: #30363d;
            color: #f0f6fc;
        }

        .bubble {
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.5;
            word-break: break-word;
            white-space: pre-wrap;
        }

        .message.user .bubble {
            background-color: var(--user-bubble);
            color: white;
            border-top-right-radius: 2px;
        }

        .message.ai .bubble {
            background-color: var(--ai-bubble);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            border-top-left-radius: 2px;
        }

        /* Typing Indicator */
        .typing .bubble {
            display: flex;
            gap: 4px;
            align-items: center;
            padding: 16px;
        }

        .typing span {
            width: 6px;
            height: 6px;
            background-color: #8b949e;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .typing span:nth-child(2) { animation-delay: 0.2s; }
        .typing span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1.0); }
        }

        /* Input Area */
        .input-area {
            padding: 16px 20px;
            background-color: var(--chat-bg);
            border-top: 1px solid var(--border-color);
        }

        .input-box {
            display: flex;
            align-items: center;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 8px 12px;
            gap: 8px;
        }

        .input-box:focus-within {
            border-color: var(--accent-color);
        }

        textarea {
            flex: 1;
            background: none;
            border: none;
            color: var(--text-color);
            font-size: 14px;
            resize: none;
            max-height: 120px;
            outline: none;
            line-height: 1.4;
        }

        .send-btn {
            background-color: var(--accent-color);
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            cursor: pointer;
            transition: background 0.2s;
            flex-shrink: 0;
        }

        .send-btn:hover {
            background-color: var(--accent-hover);
        }

        .send-btn:disabled {
            background-color: #30363d;
            cursor: not-allowed;
        }

        .footer-note {
            text-align: center;
            font-size: 11px;
            color: #8b949e;
            margin-top: 8px;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-left">
            <div class="bot-avatar">AI</div>
            <div class="bot-info">
                <h1>Gemini AI Pro</h1>
                <p>● Sẵn sàng trò chuyện</p>
            </div>
        </div>
        <button class="clear-btn" id="clear-btn" title="Xóa đoạn chat">🗑️</button>
    </header>

    <div id="chat-container">
        <div class="message ai">
            <div class="avatar">🤖</div>
            <div class="bubble">Xin chào! Tôi là trợ lý ảo AI được tích hợp trực tiếp thông qua Gemini API. Tôi có thể giúp gì cho bạn hôm nay?</div>
        </div>
    </div>

    <div class="input-area">
        <div class="input-box">
            <textarea id="user-input" rows="1" placeholder="Nhập nội dung trò chuyện với AI..."></textarea>
            <button id="send-btn" class="send-btn">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
            </button>
        </div>
        <div class="footer-note">Gemini API tích hợp sẵn • Nội dung có thể không chính xác, hãy kiểm tra các thông tin quan trọng.</div>
    </div>

    <script>
        // API Key của bạn đã được cấu hình ở đây
        const API_KEY = "AQ.Ab8RN6K5I8K06e0R74c7hOYDrqyHrCkYyVdyCluqUAejo6fHsw";
        const MODEL_NAME = "gemini-3.8-flash"; // Đã cập nhật theo model mới nhất

        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const clearBtn = document.getElementById('clear-btn');

        // Tự động điều chỉnh chiều cao ô nhập text
        userInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
        });

        // Gửi tin nhắn khi nhấn Enter (không giữ Shift)
        userInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        sendBtn.addEventListener('click', sendMessage);
        clearBtn.addEventListener('click', () => {
            chatContainer.innerHTML = `
                <div class="message ai">
                    <div class="avatar">🤖</div>
                    <div class="bubble">Đã làm mới cuộc trò chuyện. Bạn muốn hỏi gì tiếp theo?</div>
                </div>
            `;
        });

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            // Thêm tin nhắn của User
            appendMessage(text, 'user');
            userInput.value = '';
            userInput.style.height = 'auto';

            // Hiển thị hiệu ứng đang soạn tin
            const typingId = showTypingIndicator();
            scrollChat();

            try {
                // Gọi API Gemini trực tiếp từ trình duyệt
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${MODEL_NAME}:generateContent?key=${API_KEY}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{ text: text }]
                        }]
                    })
                });

                const data = await response.json();
                removeTypingIndicator(typingId);

                if (data.candidates && data.candidates[0].content) {
                    const aiReply = data.candidates[0].content.parts[0].text;
                    appendMessage(aiReply, 'ai');
                } else if (data.error) {
                    appendMessage(`⚠️ Lỗi từ API: ${data.error.message}`, 'ai');
                } else {
                    appendMessage("⚠️ Không nhận được phản hồi hợp lệ từ máy chủ AI.", 'ai');
                }

            } catch (error) {
                removeTypingIndicator(typingId);
                appendMessage(`⚠️ Lỗi kết nối mạng: ${error.message}`, 'ai');
            }

            scrollChat();
        }

        function appendMessage(text, sender) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}`;

            const avatarDiv = document.createElement('div');
            avatarDiv.className = 'avatar';
            avatarDiv.textContent = sender === 'user' ? '👤' : '🤖';

            const bubbleDiv = document.createElement('div');
            bubbleDiv.className = 'bubble';
            bubbleDiv.textContent = text;

            messageDiv.appendChild(avatarDiv);
            messageDiv.appendChild(bubbleDiv);
            chatContainer.appendChild(messageDiv);
        }

        function showTypingIndicator() {
            const id = 'typing-' + Date.now();
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message ai typing';
            messageDiv.id = id;

            const avatarDiv = document.createElement('div');
            avatarDiv.className = 'avatar';
            avatarDiv.textContent = '🤖';

            const bubbleDiv = document.createElement('div');
            bubbleDiv.className = 'bubble';
            bubbleDiv.innerHTML = '<span></span><span></span><span></span>';

            messageDiv.appendChild(avatarDiv);
            messageDiv.appendChild(bubbleDiv);
            chatContainer.appendChild(messageDiv);
            return id;
        }

        function removeTypingIndicator(id) {
            const el = document.getElementById(id);
            if (el) el.remove();
        }

        function scrollChat() {
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }
    </script>
</body>
</html>
